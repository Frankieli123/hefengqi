name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ricewind_e2e
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: ricewind_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ricewind_e2e -d ricewind_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Migrate disposable E2E database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://ricewind_e2e:disposable-ci-only@127.0.0.1:5432/ricewind_e2e?schema=public
      - name: Seed isolated CMS fixtures
        run: pnpm exec tsx tests/fixtures/seed-cms.ts
        env:
          DATABASE_URL: postgresql://ricewind_e2e:disposable-ci-only@127.0.0.1:5432/ricewind_e2e?schema=public
          E2E_DISPOSABLE_DATABASE: ricewind_e2e
          MEDIA_ROOT: /tmp/ricewind-e2e-media
      - run: pnpm test:e2e --workers=2
        env:
          DATABASE_URL: postgresql://ricewind_e2e:disposable-ci-only@127.0.0.1:5432/ricewind_e2e?schema=public
          DEMO_MODE: 'false'
          SITE_URL: http://127.0.0.1:3000
          BETTER_AUTH_URL: http://127.0.0.1:3000
          MEDIA_ROOT: /tmp/ricewind-e2e-media
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-results
          path: test-results/
      - run: pnpm build

  image:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate Server Actions encryption key
        env:
          SERVER_ACTIONS_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_ACTIONS_KEY" || { echo "Missing production NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" >&2; exit 1; }
          decoded_bytes="$(printf '%s' "$SERVER_ACTIONS_KEY" | base64 --decode | wc -c)"
          case "$decoded_bytes" in 16|24|32) ;; *) echo "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY must decode to 16, 24, or 32 bytes" >&2; exit 1;; esac
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          secrets: |
            server_actions_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}-worker
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  deploy:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Upload versioned deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          source: "compose.yaml,infrastructure,scripts/deploy.sh"
          target: /srv/hefengqi
      - name: Deploy immutable image
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script: sh /srv/hefengqi/scripts/deploy.sh ${{ github.sha }}
